[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinn-paul-trap"
version = "0.1.0"
description = "Physics-informed shape optimization for a four-rod Paul trap"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]

[tool.setuptools.packages.find]
include = ["spinn*"]

[tool.pytest.ini_options]
testpaths = ["spinn/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = ["B905", "E501"]
