experiment:
  name: joint_pig_four_rod
  seed: 0
  geometry: circular_four_rod
  r0: 1.0
  rod_radius: 1.145
  outer_radius: 5.0
  V0: 1.0
shape_network:
  type: residual_mlp
  hidden_layers: 5
  width: 64
  activation: tanh
  alpha: 0.10
  identity_pretrain_steps: 8000
  jacobian_eps: 0.05
  symmetric: true
physics_backend:
  type: pig
  K: 800
  feature_dim: 4
  decoder_layers: 2
  decoder_width: 16
  init_sigma: 0.10
sampling:
  interior_points: 30000
  electrode_boundary_points_per_electrode: 1000
  outer_boundary_points: 3000
  center_probe_radius: 0.25
  center_probe_grid: 31
  quadrupole_loss_radius: 0.25
  quadrupole_loss_grid: 17
  resample_every: 500
loss_weights:
  pde: 1.0
  bc: 100.0
  eta: 0.005
  quadrupole: 10.0
  jacobian: 500.0
  displacement: 10.0
  gap: 100.0
  curvature: 1.0
  anchor: 10.0
optimizer:
  type: adam
  steps: 60000
  lr_theta: 1.0e-3
  lr_phi: 2.0e-5
  lr_pig_centers: 5.0e-5
  lr_pig_covariances: 5.0e-5
  scheduler: cosine_decay
validation:
  fem_checkpoint_every: 5000
  seeds: [0, 1, 2]
  primary_metric: eta_fem
  valid_min_detJ: 0.2
  fem_grid: 256
